name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the verifier records git evidence (HEAD~N diffs)
          # in its artifacts; the default shallow clone would degrade it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Full verifier: static checks + local server + PWA/service-worker
      # probes (runs headless on the runner's preinstalled Chrome) +
      # the in-browser SpectorCore test harness via app.html?test.
      # Non-zero exit on any failed step fails the check.
      - name: Run verification suite
        run: python3 tests/run_verification.py
