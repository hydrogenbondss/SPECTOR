<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Standard teleprompter mode compared with Spector Comfort mode</title>
  <desc id="desc">A split comparison showing unstable text that follows head movement on the left and stable spatially anchored text in Comfort mode on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <style>
      .label { font: 700 24px Inter, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: 5px; }
      .body { font: 400 25px Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .small { font: 500 18px Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .title { font: 800 34px Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .axis { font: 700 22px Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="844" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <line x1="800" y1="86" x2="800" y2="814" stroke="#7C3AED" stroke-opacity="0.32" stroke-width="2"/>

  <g opacity="0.18">
    <rect x="68" y="126" width="650" height="500" rx="14" fill="#A1A1AA"/>
    <path d="M90 190 L690 150 M88 276 L690 220 M96 365 L706 300 M86 460 L690 398 M98 548 L710 492" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>
  </g>

  <text x="96" y="112" class="label" fill="#F4F4F6">STANDARD MODE</text>
  <text x="96" y="154" class="body" fill="#A1A1AA">Screen follows your head.</text>
  <text x="96" y="188" class="body" fill="#A1A1AA">Text shakes and drifts.</text>

  <g transform="translate(178 298) rotate(8)" filter="url(#softBlur)" opacity="0.72">
    <text x="0" y="0" class="title" fill="#F4F4F6">The Wind in the Willows</text>
    <text x="0" y="52" class="body" fill="#C9C9D1">Chapter 1</text>
    <text x="0" y="120" class="body" fill="#D8D8DE">The sun came out at last, and so the</text>
    <text x="0" y="158" class="body" fill="#D8D8DE">Wind in the Willows set out on their</text>
    <text x="0" y="196" class="body" fill="#D8D8DE">summer journey. The river sparkled</text>
    <text x="0" y="234" class="body" fill="#D8D8DE">in the sunlight.</text>
  </g>
  <path d="M576 664 C474 642 390 602 318 544" fill="none" stroke="#85858E" stroke-width="7" stroke-opacity="0.56"/>
  <path d="M329 545 L370 535 L346 574" fill="none" stroke="#85858E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.56"/>

  <g transform="translate(94 690)">
    <rect width="330" height="116" rx="10" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M34 76 L48 30 L60 86 L72 44 L88 94 L104 34 L120 82" fill="none" stroke="#A78BFA" stroke-width="4"/>
    <text x="154" y="42" class="small" fill="#F4F4F6">Unstable text</text>
    <text x="154" y="74" class="small" fill="#A1A1AA">Motion adds strain.</text>
  </g>

  <text x="920" y="112" class="label" fill="#A78BFA">COMFORT MODE</text>
  <text x="920" y="154" class="body" fill="#A1A1AA">Text is spatially anchored.</text>
  <text x="920" y="188" class="body" fill="#A1A1AA">Stable through natural movement.</text>

  <g transform="translate(930 282)">
    <rect x="0" y="0" width="484" height="350" rx="18" fill="#101012" stroke="#7C3AED" stroke-opacity="0.72" stroke-width="3"/>
    <rect x="28" y="28" width="428" height="294" rx="12" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="56" y="86" class="title" fill="#F4F4F6">The Wind in the Willows</text>
    <text x="56" y="136" class="body" fill="#C9C9D1">Chapter 1</text>
    <text x="56" y="206" class="body" fill="#D8D8DE">The sun came out at last, and so the</text>
    <text x="56" y="244" class="body" fill="#D8D8DE">Wind in the Willows set out on their</text>
    <text x="56" y="282" class="body" fill="#D8D8DE">summer journey.</text>
  </g>

  <g opacity="0.8">
    <line x1="1378" y1="480" x2="1510" y2="480" stroke="#7C3AED" stroke-width="4"/>
    <line x1="1415" y1="612" x2="1415" y2="350" stroke="#7C3AED" stroke-width="4"/>
    <path d="M1510 480 L1478 462 L1478 498 Z" fill="#7C3AED"/>
    <path d="M1415 350 L1397 382 L1433 382 Z" fill="#7C3AED"/>
    <text x="1528" y="486" class="axis" fill="#A78BFA">X</text>
    <text x="1404" y="330" class="axis" fill="#A78BFA">Y</text>
    <circle cx="1415" cy="480" r="17" fill="#101012" stroke="#A78BFA" stroke-width="3"/>
  </g>

  <path d="M780 692 C910 742 1050 738 1196 662" fill="none" stroke="#7C3AED" stroke-width="8" stroke-opacity="0.68"/>
  <path d="M1196 662 L1152 658 L1176 695" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.68"/>

  <g transform="translate(1162 690)">
    <rect width="330" height="116" rx="10" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M58 28 L100 46 L100 78 C88 94 74 102 58 108 C42 102 28 94 16 78 L16 46 Z" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linejoin="round"/>
    <path d="M42 68 L55 82 L80 54" fill="none" stroke="#A78BFA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="42" class="small" fill="#F4F4F6">Spatially anchored</text>
    <text x="130" y="74" class="small" fill="#A1A1AA">Text stays fixed in space.</text>
  </g>

  <text x="800" y="842" text-anchor="middle" class="label" fill="#A78BFA" opacity="0.78">STABILITY YOU CAN READ</text>
</svg>
